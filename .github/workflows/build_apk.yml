name: Build Safety Core AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Get Dependencies
        run: flutter pub get

      - name: 5. Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCoreAI-Release
          path: build/app/outputs/flutter-apk/app-release.apk
