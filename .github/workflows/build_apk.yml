name: Build Safety Core AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Create Android Shell Only
        run: |
          # إنشاء هيكل أندرويد في مجلد مؤقت ثم نقل مجلد android فقط
          flutter create temp_app --platforms=android --org com.safetycore.ai
          cp -r temp_app/android ./
          rm -rf temp_app

      - name: 5. Fetch Dependencies
        run: flutter pub get

      - name: 6. Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCoreAI-Release
          path: build/app/outputs/flutter-apk/app-release.apk
