name: Build Safety Core AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # هذه الخطوة تنشئ ملفات نظام أندرويد الناقصة تلقائياً
      - name: 4. Scaffold Android Project
        run: flutter create . --platforms=android

      - name: 5. Get Dependencies
        run: flutter pub get

      - name: 6. Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCoreAI-Release
          path: build/app/outputs/flutter-apk/app-release.apk
