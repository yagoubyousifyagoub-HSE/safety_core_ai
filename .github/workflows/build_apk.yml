name: Build Safety Core AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Extract Project Archive
        run: |
          mkdir -p extracted_files
          unzip -o \*.zip -d extracted_files/ || true
          if [ -d "extracted_files/safety_core_ai" ]; then
            cp -rf extracted_files/safety_core_ai/* ./
          elif [ -d "extracted_files" ]; then
            cp -rf extracted_files/* ./ 2>/dev/null || true
          fi
          rm -rf extracted_files
          git checkout HEAD -- lib/ 2>/dev/null || true

      - name: 5. Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            flutter create temp_shell --platforms=android --org com.safetycore.ai
            cp -r temp_shell/android ./
            rm -rf temp_shell
          fi

      - name: 6. Install Dependencies
        run: |
          sed -i 's/intl:.*/intl: any/g' pubspec.yaml || true
          flutter pub get

      - name: 7. Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 8. Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCoreAI-Admin-Release
          path: build/app/outputs/flutter-apk/app-release.apk
